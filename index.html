<title>Burrow</title>

<style>
/* Layout: sticky top bar with four sections (Home, Videos, Photos, Communities). Content column plus a right rail on wide screens. Post pages switch layout by media type: photo (image + thread), video (player + up next), discussion (single column). */
:root {
  --bg: #f1f3f8;
  --surface: #ffffff;
  --surface-2: #e9edf5;
  --fg: #0f1629;
  --muted: #5b6580;
  --line: #d8deeb;
  --accent: #2457f5;
  --accent-ink: #ffffff;
  --accent-soft: #dfe7ff;
  --up: #e4572e;
  --down: #5b6cf0;
  --ok: #0f8a5f;
  --font-display: "Sora", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1020; --surface: #131a2e; --surface-2: #1c2540; --fg: #e8ecf8; --muted: #97a1c0; --line: #27314f;
    --accent: #6d8dff; --accent-ink: #0a1030; --accent-soft: #1b2850; --up: #ff7a4d; --down: #8e9bff; --ok: #3ecf93; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1020; --surface: #131a2e; --surface-2: #1c2540; --fg: #e8ecf8; --muted: #97a1c0; --line: #27314f;
  --accent: #6d8dff; --accent-ink: #0a1030; --accent-soft: #1b2850; --up: #ff7a4d; --down: #8e9bff; --ok: #3ecf93; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5; margin: 0;
  padding-bottom: 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.topin { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 800; font-size: 21px; }
.logo svg { width: 30px; height: 30px; }
.nav { display: flex; gap: 4px; overflow-x: auto; flex: 1 1 auto; min-width: 0; }
.nav a { display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 10px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.nav a:hover { background: var(--surface-2); color: var(--fg); }
.nav a.on { background: var(--accent-soft); color: var(--accent); }
.search { flex: 1 1 200px; max-width: 320px; position: relative; }
.search input { width: 100%; padding: 9px 12px 9px 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
.btn.small { padding: 5px 12px; font-size: 14px; border-radius: 8px; }
.btn.danger { background: transparent; color: var(--up); border: 1px solid var(--line); }

.shell { max-width: 1180px; margin: 18px auto 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.shell.wide { grid-template-columns: minmax(0, 1fr); }
.main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.rail { display: flex; flex-direction: column; gap: 14px; min-width: 0; position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.pad { padding: 16px; }
.official-badge{display:inline-flex;align-items:center;gap:5px;margin:5px 0;padding:5px 9px;border-radius:999px;background:linear-gradient(135deg,#fff3c4,#f6d77a);color:#704900;border:1px solid #d6ad42;font-size:11px;font-weight:800;letter-spacing:.02em}.vip-action{white-space:nowrap;align-self:center}.member-admin-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px;border-bottom:1px solid var(--line)}.member-admin-row:last-child{border-bottom:0}.tag { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hint { color: var(--muted); font-size: 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

.notice { padding: 12px 16px; border-radius: 12px; background: var(--accent-soft); color: var(--fg); font-size: 14px; }
.empty { padding: 36px 20px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty h3 { font-size: 20px; }
.empty p { color: var(--muted); max-width: 46ch; }

/* avatars + stories */
.av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; color: #fff; flex: none; font-size: 15px; }
.av.sq { border-radius: 12px; }
.av.lg { width: 64px; height: 64px; font-size: 26px; border-radius: 18px; }
.av.xs { width: 24px; height: 24px; font-size: 11px; }
.stories { display: flex; gap: 14px; overflow-x: auto; padding: 14px 16px; }
.story { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 70px; flex: none; font-size: 13px; font-weight: 600; text-align: center; }
.story .ring { padding: 3px; border-radius: 50%; border: 2px solid var(--accent); }
.story .ring.off { border-color: var(--line); }
.story span { max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* filters */
.bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 14px; color: var(--muted); }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.start { display: flex; gap: 12px; align-items: center; padding: 12px 16px; }
.start button { flex: 1; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 10px 16px; color: var(--muted); }

/* post card */
.post { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; }
.phead { display: flex; align-items: center; gap: 10px; min-width: 0; }
.phead .who { min-width: 0; line-height: 1.25; }
.phead .who b { font-weight: 700; }
.phead .who span { color: var(--muted); font-size: 13px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sample { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.title { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.28; overflow-wrap: anywhere; }
.title:hover { color: var(--accent); }
.excerpt { color: var(--muted); overflow-wrap: anywhere; }
.media { position: relative; display: block; border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.media img, .media video { display: block; width: 100%; max-height: 520px; object-fit: cover; background: #000; }
.media.v::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.18); }
.play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 58px; height: 58px; border-radius: 50%; background: rgba(15,22,41,.78); display: grid; place-items: center; z-index: 2; color: #fff; }
.play svg { width: 26px; height: 26px; fill: #fff; stroke: none; margin-left: 3px; }
.badge { position: absolute; left: 10px; top: 10px; z-index: 2; background: rgba(15,22,41,.8); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.act { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 14px; color: var(--muted); }
.act:hover { color: var(--fg); border-color: var(--muted); }
.act.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.votes { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 800; font-variant-numeric: tabular-nums; }
.votes button { border: 0; background: transparent; width: 34px; height: 32px; display: grid; place-items: center; color: var(--muted); border-radius: 999px; }
.votes button:hover { background: var(--surface-2); }
.votes button.up.on { color: var(--up); } .votes button.up.on svg { fill: var(--up); }
.votes button.down.on { color: var(--down); } .votes button.down.on svg { fill: var(--down); }
.votes .n { min-width: 24px; text-align: center; font-size: 14px; }
.votes.sm button { width: 26px; height: 24px; } .votes.sm svg { width: 14px; height: 14px; }
.votes.sm .n { font-size: 13px; min-width: 18px; }

/* video grid */
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px 16px; }
.vcard { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.vcard .media { aspect-ratio: 16 / 9; } .vcard .media video { height: 100%; max-height: none; }
.vcard .info { display: flex; gap: 10px; min-width: 0; }
.vcard .t { font-family: var(--font-display); font-weight: 700; font-size: 16px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.vcard .m { color: var(--muted); font-size: 13px; }

/* photo grid */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
.tile { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--surface-2); display: block; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .ov { position: absolute; inset: 0; background: rgba(8,12,28,.55); color: #fff; display: flex; gap: 16px; align-items: center; justify-content: center; font-weight: 800; opacity: 0; transition: opacity .15s; }
.tile:hover .ov, .tile:focus-visible .ov { opacity: 1; }
.tile .ov span { display: inline-flex; align-items: center; gap: 5px; }
@media (hover: none) { .tile .ov { opacity: 1; background: linear-gradient(transparent 55%, rgba(8,12,28,.7)); align-items: flex-end; padding-bottom: 8px; } }

/* communities */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.ccard { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.ccard .top { display: flex; gap: 12px; align-items: center; min-width: 0; }
.ccard h3 { font-size: 17px; }
.ccard p.about { color: var(--muted); font-size: 14px; flex: 1; overflow-wrap: anywhere; }
.chead { overflow: hidden; }
.chead .band { height: 84px; }
.chead .body { padding: 0 18px 18px; display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; margin-top: -30px; }
.chead .av.lg { border: 4px solid var(--surface); width: 76px; height: 76px; }
.chead .txt { flex: 1; min-width: 200px; padding-top: 34px; }
.chead h2 { font-size: 24px; }

/* post detail */
.back { align-self: flex-start; }
.detail { display: grid; gap: 14px; align-items: start; }
.detail.photo { grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr); }
.detail.video { grid-template-columns: minmax(0, 1fr) 320px; }
.detail.text { grid-template-columns: minmax(0, 1fr); max-width: 780px; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.player video { width: 100%; max-height: 70vh; background: #000; border-radius: 14px; display: block; }
.player img { width: 100%; max-height: 78vh; object-fit: contain; background: #000; border-radius: 14px; display: block; }
.desc { white-space: pre-wrap; overflow-wrap: anywhere; }
.next { display: flex; gap: 10px; min-width: 0; }
.next .thumb { width: 130px; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: var(--surface-2); flex: none; }
.next .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.next .t { font-weight: 700; font-size: 14px; line-height: 1.3; font-family: var(--font-display); overflow-wrap: anywhere; }
.next .m { color: var(--muted); font-size: 12px; }

/* comments */
.cmts { display: flex; flex-direction: column; }
.cm { display: flex; flex-direction: column; gap: 4px; padding-top: 12px; }
.cm .kids { margin-left: 13px; padding-left: 13px; border-left: 2px solid var(--line); display: flex; flex-direction: column; }
.cm .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.cm .meta { color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cm .meta b { color: var(--fg); }
.linkbtn { border: 0; background: transparent; color: var(--muted); font-weight: 700; font-size: 13px; padding: 2px 6px; }
.linkbtn:hover { color: var(--fg); }
.form { display: flex; flex-direction: column; gap: 8px; }
.form[hidden] { display: none; }
textarea, .field { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; }
textarea { min-height: 80px; resize: vertical; }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(6,9,22,.6); z-index: 40; display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.scrim[hidden] { display: none; }
.modal { width: min(560px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 32px); overflow-y: auto; }
.modal h2 { font-size: 21px; }
.lbl { font-size: 13px; font-weight: 700; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px; font-weight: 700; display: flex; gap: 6px; justify-content: center; align-items: center; color: var(--muted); }
.seg button.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.preview { border-radius: 12px; overflow: hidden; background: #000; }
.preview img, .preview video { width: 100%; max-height: 240px; object-fit: contain; display: block; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 32px; height: 32px; border-radius: 10px; border: 3px solid transparent; }
.sw.on { border-color: var(--fg); }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 60; max-width: calc(100vw - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.rank { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); min-width: 0; }
.rank:first-of-type { border-top: 0; }
.rank .nm { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .nm span { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }

.av { overflow: hidden; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.me { display: grid; place-items: center; border-radius: 50%; flex: none; }
.me[hidden] { display: none; }
.me .av { width: 36px; height: 36px; }
.profile { overflow: hidden; }
.profile .band { height: 130px; }
.profile .body { padding: 0 20px 18px; display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; margin-top: -48px; }
.profile .av.xl { width: 104px; height: 104px; font-size: 42px; border: 4px solid var(--surface); }
.profile .txt { flex: 1; min-width: 220px; padding-top: 52px; display: flex; flex-direction: column; gap: 6px; }
.profile .acts2 { padding-top: 52px; display: flex; gap: 8px; flex-wrap: wrap; }
.profile h2 { font-size: 26px; }
.handle { color: var(--muted); font-weight: 700; }
.facts { display: flex; gap: 6px 16px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
.facts a { color: var(--accent); font-weight: 700; }
.pstats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
.pstats div { padding: 12px 8px; text-align: center; }
.pstats b { display: block; font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.pstats span { color: var(--muted); font-size: 13px; }
.meter { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.miniprof { display: flex; gap: 12px; align-items: center; min-width: 0; }
.miniprof .nm { min-width: 0; line-height: 1.25; }
.miniprof .nm b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cm .meta .av { width: 22px; height: 22px; font-size: 10px; }
.todo { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
@media (max-width: 980px) { .shell { grid-template-columns: minmax(0, 1fr); } .rail { position: static; } .detail.photo, .detail.video { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { .search { max-width: none; order: 5; flex-basis: 100%; } .topin { gap: 8px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

    <div class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.500-3.500"/></svg><input id="q" type="search" placeholder="Search posts and communities" aria-label="Search"></div>
    <button class="btn" id="btn-create"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Create</button>
    <a class="me" id="me" href="#home" aria-label="Your profile" hidden></a>
  </div>
</header>

<div class="shell" id="shell">
  <main class="main" id="main"><div class="card empty"><p>Loading...</p></div></main>
  <aside class="rail" id="rail"></aside>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ICON = {
    home: '<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
    video: '<rect x="3" y="6" width="14" height="12" rx="2"/><path d="M17 10l4-2v8l-4-2z"/>',
    photo: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
    people: '<circle cx="9" cy="8" r="3.500"/><path d="M2.500 20a6.500 6.500 0 0 1 13 0M16 4.500a3.500 3.500 0 0 1 0 7M18 20a6.500 6.500 0 0 0-3-5.500"/>',
    chat: '<path d="M4 5h16v11H9l-5 4z"/>',
    up: '<path d="M12 5l7 8h-4v6H9v-6H5z"/>',
    down: '<path d="M12 19l-7-8h4V5h6v6h4z"/>',
    save: '<path d="M6 4h12v16l-6-4-6 4z"/>',
    share: '<path d="M4 12v7h16v-7M12 3v12M7 8l5-5 5 5"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
    text: '<path d="M5 6h14M5 12h14M5 18h9"/>'
  };
  function ic(n) { return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + ICON[n] + "</svg>"; }
  var PLAY = '<span class="play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span>';
  var COLORS = ["#2457f5", "#c2410c", "#0f766e", "#7c3aed", "#be123c", "#4d7c0f", "#0369a1", "#a16207"];
  var MIN = 60000;

  var S = { db: null, user: null, authUser: null, assets: null, uid: null, canWrite: false, canEdit: false, canUpload: false, isAdmin: false, authReady: false, authMode: "login", authBusy: false, appStarted: false,
    route: "home", q: "", sort: "hot", filter: "all", comms: [], posts: [], cmts: [], names: {}, profiles: {}, follows: [], memberships: [], moderators: [], onlineCount: 0,
    adminStats: { users: 0, posts: 0, comments: 0, communities: 0, newToday: 0 }, adminMembers: [], profileBadges: [], myName: "Member", prLoaded: false, onboarded: false,
    prof: { joined: [], saved: [] }, loaded: { c: false, p: false, m: false }, failed: false };
  var pending = {};

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]; }); }
  function cut(t, n) { t = String(t || ""); return t.length > n ? t.slice(0, n).trim() + "..." : t; }
  function ago(t) { var m = Math.max(1, Math.round((Date.now() - t) / MIN)); if (m < 60) return m + " min ago"; var h = Math.round(m / 60); if (h < 24) return h + " h ago"; var d = Math.round(h / 24); return d < 30 ? d + " d ago" : new Date(t).toLocaleDateString(); }
  function score(o) { return (o.up || []).length - (o.down || []).length; }
  function hot(p) { var age = (Date.now() - (p.createdAt || 0)) / 36e5; return score(p) / Math.pow(Math.max(age, 0) + 2, 1.4); }
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 30); }
  function media(p) { return p.assetId ? (localAssets[p.assetId] || p.assetUrl || "") : ""; }
  var localAssets = {};
  function comm(id) { return S.comms.filter(function (c) { return c.id === id; })[0]; }
  function post(id) { return S.posts.filter(function (p) { return p.id === id; })[0]; }
  function nCm(pid) { return S.cmts.filter(function (c) { return c.postId === pid; }).length; }
  function prof(uid) { return (uid && S.profiles[uid]) || null; }
  function followerCount(uid) { return S.follows.filter(function (x) { return x.following_id === uid; }).length; }
  function followingCount(uid) { return S.follows.filter(function (x) { return x.follower_id === uid; }).length; }
  function communityCount(id) { return S.memberships.filter(function (x) { return x.community_id === id; }).length; }
  function isFollowing(uid) { return S.follows.some(function (x) { return x.follower_id === S.uid && x.following_id === uid; }); }
  function isMember(id) { return S.memberships.some(function (x) { return x.user_id === S.uid && x.community_id === id; }); }
  function author(o) { var p = prof(o.authorId); return (p && p.name) || (o.authorId && S.names[o.authorId]) || (o.authorId && o.authorId === S.uid && S.myName) || o.authorName || "Member"; }
  function uroute(uid) { return "u-" + String(uid).replace(/[^A-Za-z0-9]/g, function (c) { return "-" + c.charCodeAt(0).toString(16) + "-"; }); }
  function ufrom(r) { return r.slice(2).replace(/-([0-9a-f]{2})-/g, function (m, h) { return String.fromCharCode(parseInt(h, 16)); }); }
  function personAv(uid, name, cls) {
    var p = prof(uid), col = (p && p.color) || COLORS[uid ? uid.charCodeAt(uid.length - 1) % COLORS.length : 0], nm = (p && p.name) || name || "?";
    if (p && (p.avatarUrl || (p.avatarAsset && localAssets[p.avatarAsset]))) return '<span class="av ' + (cls || "") + '" style="background:' + esc(col) + '"><img src="' + esc(p.avatarUrl || localAssets[p.avatarAsset]) + '" alt=""></span>';
    return '<span class="av ' + (cls || "") + '" style="background:' + esc(col) + '" aria-hidden="true">' + esc(nm.charAt(0).toUpperCase()) + "</span>";
  }
  function userLink(o) { return o.authorId ? '<a href="#' + uroute(o.authorId) + '">' + esc(author(o)) + "</a>" : esc(author(o)); }
  function karmaOf(uid) {
    var k = 0; S.posts.concat(S.cmts).forEach(function (o) { if (o.authorId === uid) k += (o.up || []).filter(function (x) { return x !== uid; }).length - (o.down || []).filter(function (x) { return x !== uid; }).length; });
    return k;
  }
  var toastT; function toast(m) { var e = $("toast"); e.textContent = m; e.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function () { e.classList.remove("show"); }, 2400); }
  function avatar(c, cls) { var col = (c && c.color) || COLORS[0]; return '<span class="av ' + (cls || "") + '" style="background:' + esc(col) + '" aria-hidden="true">' + esc(((c && c.title) || "?").charAt(0).toUpperCase()) + "</span>"; }
  function mine(o) { return !!S.uid && o.authorId === S.uid; }
  function canDel(o) { var cid = o && (o.community || (o.postId && post(o.postId) && post(o.postId).community)); return mine(o) || (o && o.createdBy === S.uid) || S.canEdit || !!(cid && S.moderators.some(function(m){ return m.community_id === cid && m.user_id === S.uid; })); }

  /* ---------- views ---------- */
  function filtered() {
    var q = S.q.trim().toLowerCase();
    return S.posts.filter(function (p) {
      if (S.filter === "video" && p.kind !== "video") return false;
      if (S.filter === "photo" && p.kind !== "photo") return false;
      if (S.filter === "text" && p.kind !== "text") return false;
      if (S.route.indexOf("c-") === 0 && p.community !== S.route.slice(2)) return false;
      if (!q) return true;
      var c = comm(p.community);
      return (p.title + " " + (p.body || "") + " " + (c ? c.title : "")).toLowerCase().indexOf(q) >= 0;
    });
  }
  function sorted(list) {
    list = list.slice();
    if (S.sort === "hot") list.sort(function (a, b) { return hot(b) - hot(a); });
    else if (S.sort === "new") list.sort(function (a, b) { return b.createdAt - a.createdAt; });
    else list.sort(function (a, b) { return score(b) - score(a); });
    return list;
  }
  function votes(kind, o, sm) {
    var up = S.uid && (o.up || []).indexOf(S.uid) >= 0, dn = S.uid && (o.down || []).indexOf(S.uid) >= 0, sc = score(o);
    return '<span class="votes' + (sm ? " sm" : "") + '"><button class="up' + (up ? " on" : "") + '" data-act="vote" data-k="' + kind + '" data-id="' + esc(o.id) + '" data-d="1" aria-label="Upvote" aria-pressed="' + !!up + '">' + ic("up") + '</button><span class="n">' + sc + '</span><button class="down' + (dn ? " on" : "") + '" data-act="vote" data-k="' + kind + '" data-id="' + esc(o.id) + '" data-d="-1" aria-label="Downvote" aria-pressed="' + !!dn + '">' + ic("down") + "</button></span>";
  }
  function actions(p) {
    var saved = S.prof.saved.indexOf(p.id) >= 0;
    return '<div class="acts">' + votes("post", p) + '<a class="act" href="#p-' + esc(p.id) + '">' + ic("chat") + nCm(p.id) + '</a><button class="act' + (saved ? " on" : "") + '" data-act="save" data-id="' + esc(p.id) + '">' + ic("save") + (saved ? "Saved" : "Save") + '</button><button class="act" data-act="share" data-id="' + esc(p.id) + '">' + ic("share") + "Share</button>" + (canDel(p) ? '<button class="act" data-act="delpost" data-id="' + esc(p.id) + '" aria-label="Delete post">' + ic("trash") + "</button>" : "") + "</div>";
  }
  function mediaThumb(p) {
    if (p.kind === "photo") return '<a class="media" href="#p-' + esc(p.id) + '"><img src="' + media(p) + '" alt="' + esc(p.title) + '" loading="lazy"></a>';
    if (p.kind === "video") return '<a class="media v" href="#p-' + esc(p.id) + '" aria-label="Watch ' + esc(p.title) + '"><video src="' + media(p) + '#t=0.1" preload="metadata" muted playsinline></video><span class="badge">Video</span>' + PLAY + "</a>";
    return "";
  }
  function head(p) {
    var c = comm(p.community);
    var pr = prof(p.authorId);
    return '<div class="phead">' + (p.authorId ? '<a href="#' + uroute(p.authorId) + '" aria-label="Profile of ' + esc(author(p)) + '">' + personAv(p.authorId, author(p), "") + "</a>" : personAv(null, author(p), "")) + '<div class="who"><b>' + userLink(p) + (pr && pr.handle ? ' <span style="display:inline;font-weight:400">@' + esc(pr.handle) + "</span>" : "") + '</b><span><a href="#c-' + esc(p.community) + '">c/' + esc(c ? c.title : p.community) + "</a> · " + ago(p.createdAt) + "</span></div></div>";
  }
  function card(p) {
    return '<article class="card post">' + head(p) + '<a class="title" href="#p-' + esc(p.id) + '">' + esc(p.title) + "</a>" + mediaThumb(p) + (p.body ? '<p class="excerpt">' + esc(cut(p.body, 220)) + "</p>" : "") + actions(p) + "</article>";
  }
  function filterBar() {
    var f = [["all", "All"], ["video", "Videos"], ["photo", "Photos"], ["text", "Discussions"]];
    return '<div class="bar"><div class="chips">' + f.map(function (x) { return '<button class="chip' + (S.filter === x[0] ? " on" : "") + '" data-act="filter" data-v="' + x[0] + '">' + x[1] + "</button>"; }).join("") + '</div><div class="chips">' + ["hot", "new", "top"].map(function (s) { return '<button class="chip' + (S.sort === s ? " on" : "") + '" data-act="sort" data-v="' + s + '">' + s[0].toUpperCase() + s.slice(1) + "</button>"; }).join("") + "</div></div>";
  }
  function emptyFeed() {
    if (!S.comms.length) return '<div class="card empty"><h3>Start your first community</h3><p>Communities hold the videos, photos and discussions. Create one, then post into it.</p><button class="btn" data-act="newcomm">Create a community</button></div>';
    return '<div class="card empty"><h3>Nothing to show yet</h3><p>' + (S.q ? "No posts match your search." : "Be the first to post here.") + '</p>' + (S.q ? "" : '<button class="btn" data-act="newpost">Create a post</button>') + "</div>";
  }
  function viewHome() {
    var h = completeCard();
    if (S.comms.length) h += '<section class="card" aria-label="Communities"><div class="stories">' + S.comms.map(function (c) { var j = S.prof.joined.indexOf(c.id) >= 0; return '<a class="story" href="#c-' + esc(c.id) + '"><span class="ring' + (j ? "" : " off") + '">' + avatar(c) + "</span><span>" + esc(c.title) + "</span></a>"; }).join("") + "</div></section>";
    h += '<div class="card start">' + personAv(S.uid, author({ authorId: S.uid }), "") + '<button data-act="newpost">Share a video, photo or thought</button></div>';
    h += filterBar();
    var list = sorted(filtered());
    h += list.length ? list.map(card).join("") : emptyFeed();
    return h;
  }
  function viewVideos() {
    var list = sorted(filtered().filter(function (p) { return p.kind === "video"; }));
    var h = '<div class="spread"><h2>Videos</h2><div class="chips">' + ["hot", "new", "top"].map(function (s) { return '<button class="chip' + (S.sort === s ? " on" : "") + '" data-act="sort" data-v="' + s + '">' + s[0].toUpperCase() + s.slice(1) + "</button>"; }).join("") + "</div></div>";
    if (!list.length) return h + '<div class="card empty"><h3>No videos yet</h3><p>Upload an MP4 or WebM and it appears here as a watch page with comments and votes.</p><button class="btn" data-act="newpost" data-kind="video">Upload a video</button></div>';
    return h + '<div class="vgrid">' + list.map(function (p) {
      var c = comm(p.community);
      return '<article class="vcard"><a class="media v" href="#p-' + esc(p.id) + '" aria-label="Watch ' + esc(p.title) + '"><video src="' + media(p) + '#t=0.1" preload="metadata" muted playsinline></video>' + PLAY + '</a><div class="info">' + avatar(c, "") + '<div style="min-width:0"><a class="t" href="#p-' + esc(p.id) + '">' + esc(p.title) + '</a><div class="m">c/' + esc(c ? c.title : p.community) + " · " + esc(author(p)) + '</div><div class="m">' + score(p) + " votes · " + nCm(p.id) + " comments · " + ago(p.createdAt) + "</div></div></div></article>";
    }).join("") + "</div>";
  }
  function viewPhotos() {
    var list = sorted(filtered().filter(function (p) { return p.kind === "photo"; }));
    var h = '<div class="spread"><h2>Photos</h2><div class="chips">' + ["hot", "new", "top"].map(function (s) { return '<button class="chip' + (S.sort === s ? " on" : "") + '" data-act="sort" data-v="' + s + '">' + s[0].toUpperCase() + s.slice(1) + "</button>"; }).join("") + "</div></div>";
    if (!list.length) return h + '<div class="card empty"><h3>No photos yet</h3><p>Upload an image and it shows up in this grid. Tap one to open it with its comments.</p><button class="btn" data-act="newpost" data-kind="photo">Upload a photo</button></div>';
    return h + '<div class="pgrid">' + list.map(function (p) { return '<a class="tile" href="#p-' + esc(p.id) + '" aria-label="' + esc(p.title) + '"><img src="' + media(p) + '" alt="' + esc(p.title) + '" loading="lazy"><span class="ov"><span>' + ic("up") + score(p) + "</span><span>" + ic("chat") + nCm(p.id) + "</span></span></a>"; }).join("") + "</div>";
  }
  function joinBtn(c, small) {
    var j = isMember(c.id);
    return '<button class="btn ' + (j ? "ghost " : "") + (small ? "small" : "") + '" data-act="join" data-id="' + esc(c.id) + '"' + (S.uid ? "" : " disabled") + ">" + (j ? "Joined" : "Join") + "</button>";
  }
  function viewComms() {
    var q = S.q.trim().toLowerCase(), list = S.comms.filter(function (c) { return !q || (c.title + " " + c.about).toLowerCase().indexOf(q) >= 0; });
    var h = '<div class="spread"><h2>Communities</h2><button class="btn" data-act="newcomm">' + ic("people") + "New community</button></div>";
    if (!list.length) return h + '<div class="card empty"><h3>No communities yet</h3><p>Create the first one and set what it is about.</p><button class="btn" data-act="newcomm">Create a community</button></div>';
    return h + '<div class="cgrid">' + list.map(function (c) {
      var n = S.posts.filter(function (p) { return p.community === c.id; }).length;
      return '<div class="card ccard"><div class="top">' + avatar(c, "lg") + '<div style="min-width:0"><h3><a href="#c-' + esc(c.id) + '">c/' + esc(c.title) + '</a></h3><span class="hint">' + n + (n === 1 ? " post" : " posts") + ' · ' + communityCount(c.id) + ' members</span></div></div><p class="about">' + esc(c.about || "No description yet.") + '</p><div class="row">' + joinBtn(c, true) + '<a class="btn ghost small" href="#c-' + esc(c.id) + '">Open</a></div></div>';
    }).join("") + "</div>";
  }
  function viewCommunity(id) {
    var c = comm(id);
    if (!c) return '<a class="btn ghost small back" href="#communities">All communities</a><div class="card empty"><h3>Community not found</h3><p>It may have been removed.</p></div>';
    var n = S.posts.filter(function (p) { return p.community === id; }).length;
    var owner = c.createdBy, ownerName = owner ? author({ authorId: owner }) : "Unknown";
    var h = '<a class="btn ghost small back" href="#communities">All communities</a><section class="card chead"><div class="band" style="background:' + esc(c.color) + '"></div><div class="body">' + avatar(c, "lg sq") + '<div class="txt"><h2>c/' + esc(c.title) + '</h2><p class="hint">' + n + (n === 1 ? " post" : " posts") + " · " + communityCount(id) + " members · " + S.moderators.filter(function(m){return m.community_id===id;}).length + " moderators · Owner: " + (owner ? '<a href="#' + uroute(owner) + '">' + esc(ownerName) + '</a>' : 'Unknown') + " · " + esc(c.about || "") + '</p><button class="linkbtn" data-act="showmembers" data-id="' + esc(id) + '">View members</button>' + (owner===S.uid ? '<button class="linkbtn" data-act="modmanager" data-id="' + esc(id) + '">Manage moderators</button>' : '') + '</div><div class="row">' + joinBtn(c) + '<button class="btn" data-act="newpost" data-comm="' + esc(id) + '">Post here</button>' + (canDel(c) ? '<button class="btn danger" data-act="delcomm" data-id="' + esc(id) + '">Delete</button>' : "") + "</div></div></section>";
    h += filterBar();
    var list = sorted(filtered());
    return h + (list.length ? list.map(card).join("") : '<div class="card empty"><h3>No posts here yet</h3><p>Start the conversation with a video, photo or question.</p><button class="btn" data-act="newpost" data-comm="' + esc(id) + '">Create a post</button></div>');
  }

  /* comments */
  function cmTree(pid) {
    var all = S.cmts.filter(function (c) { return c.postId === pid; }), by = {};
    all.forEach(function (c) { var k = c.parentId || "root"; (by[k] = by[k] || []).push(c); });
    function build(k) { return (by[k] || []).sort(function (a, b) { return score(b) - score(a) || a.createdAt - b.createdAt; }).map(function (c) { return { c: c, kids: build(c.id) }; }); }
    return build("root");
  }
  function cmHtml(n) {
    var c = n.c;
    return '<div class="cm"><div class="meta">' + personAv(c.authorId, author(c), "") + "<b>" + userLink(c) + "</b><span>" + ago(c.createdAt) + '</span></div><p class="txt">' + esc(c.text) + '</p><div class="row">' + votes("comment", c, true) + (S.canWrite ? '<button class="linkbtn" data-act="reply" data-id="' + esc(c.id) + '">Reply</button>' : "") + (canDel(c) ? '<button class="linkbtn" data-act="delcm" data-id="' + esc(c.id) + '">Delete</button>' : "") + '</div><form class="form" data-form="reply" data-post="' + esc(c.postId) + '" data-parent="' + esc(c.id) + '" id="rf-' + esc(c.id) + '" hidden><textarea data-keep="rt-' + esc(c.id) + '" aria-label="Your reply" placeholder="Write a reply"></textarea><div class="row"><button class="btn small" type="submit">Reply</button></div></form>' +
      (n.kids.length ? '<div class="kids">' + n.kids.map(cmHtml).join("") + "</div>" : "") + "</div>";
  }
  function commentsBlock(p) {
    var tree = cmTree(p.id), n = nCm(p.id);
    return '<section class="card pad stack" aria-label="Comments"><h3>' + n + (n === 1 ? " comment" : " comments") + "</h3>" +
      (S.canWrite ? '<form class="form" data-form="top" data-post="' + esc(p.id) + '"><textarea data-keep="tc-' + esc(p.id) + '" aria-label="Add a comment" placeholder="Add a comment"></textarea><div class="row"><button class="btn small" type="submit">Comment</button></div></form>' : '<p class="notice">You can read comments here. Posting needs contributor access.</p>') +
      '<div class="cmts">' + (tree.length ? tree.map(cmHtml).join("") : '<p class="hint" style="padding-top:8px">No comments yet.</p>') + "</div></section>";
  }

  var keepMedia = null;
  function viewPost(id) {
    var p = post(id);
    if (!p) return '<a class="btn ghost small back" href="#home">Back to home</a><div class="card empty"><h3>Post not found</h3><p>It may have been deleted.</p></div>';
    var c = comm(p.community), info = '<section class="card pad stack">' + head(p) + "<h2>" + esc(p.title) + "</h2>" + (p.body ? '<p class="desc">' + esc(p.body) + "</p>" : "") + actions(p) + "</section>";
    var back = '<a class="btn ghost small back" href="#' + (p.kind === "video" ? "videos" : p.kind === "photo" ? "photos" : "c-" + esc(p.community)) + '">Back</a>';
    if (p.kind === "video") {
      var next = sorted(S.posts.filter(function (x) { return x.kind === "video" && x.id !== p.id; })).slice(0, 8);

      }};
    })};
  }
  function tableForPath(path) {
    var a = String(path).split("/").filter(Boolean);
    if (a[0] === "data" && a[1] === "users") return { table: "user_data", id: a[2], key: a[3] || "profile" };
    return { table: a[0], id: a[1] };
  }
  function supaDB() {
    return {
      collection: function (name) {
        return { onSnapshot: function (ok, fail) {
          var alive = true;
          function refresh() {
            sbClient.from(name).select("id,data").then(function (res) {
              if (!alive) return;
              if (res.error) { if (fail) fail(res.error); return; }
              ok(snapshotFromRows(res.data));
            }).catch(function (e) { if (fail) fail(e); });
          }
          refresh();
          var channel = sbClient.channel("burrow-" + name + "-" + Math.random().toString(36).slice(2))
            .on("postgres_changes", { event: "*", schema: "public", table: name }, refresh)
            .subscribe();
          return function () { alive = false; sbClient.removeChannel(channel); };
        }};
      },
      doc: function (path) {
        var loc = tableForPath(path);
        return {
          set: function (value) {
            var record = loc.table === "user_data"
              ? { user_id: loc.id, key: loc.key, data: value || {} }
              : { id: loc.id, data: value || {} };
            var conflict = loc.table === "user_data" ? "user_id,key" : "id";
            return sbClient.from(loc.table).upsert(record, { onConflict: conflict }).then(function (r) {
              if (r.error) throw r.error;
            });
          },
          update: function (value) {
            return sbClient.from(loc.table).select("data").eq(loc.table === "user_data" ? "user_id" : "id", loc.id)
              .then(function (r) {
                if (r.error) throw r.error;
                var existing = loc.table === "user_data"
                  ? ((r.data || []).filter(function (x) { return x.key === loc.key; })[0] || {}).data
                  : (r.data && r.data[0] && r.data[0].data);
                if (!existing) throw new Error("Record not found");
                var merged = Object.assign({}, existing, value || {});
                if (loc.table === "user_data") {
                  return sbClient.from("user_data").upsert({ user_id: loc.id, key: loc.key, data: merged }, { onConflict: "user_id,key" });
                }
                return sbClient.from(loc.table).update({ data: merged }).eq("id", loc.id);
              }).then(function (r) { if (r && r.error) throw r.error; });
          },
          delete: function () {
            var q = sbClient.from(loc.table).delete();
            if (loc.table === "user_data") q = q.eq("user_id", loc.id).eq("key", loc.key);
            else q = q.eq("id", loc.id);
            return q.then(function (r) { if (r.error) throw r.error; });
          },
          onSnapshot: function (ok, fail) {
            var alive = true;
            function refresh() {
              var q = sbClient.from(loc.table).select("*");
              q = loc.table === "user_data"
                ? q.eq("user_id", loc.id).eq("key", loc.key)
                : q.eq("id", loc.id);
              q.maybeSingle().then(function (r) {
                if (!alive) return;
                if (r.error) { if (fail) fail(r.error); return; }
                var row = r.data;
                ok({ exists: !!row, data: function () { return row ? row.data : null; } });
              }).catch(function (e) { if (fail) fail(e); });
            }
            refresh();
            var channel = sbClient.channel("burrow-doc-" + Math.random().toString(36).slice(2))
              .on("postgres_changes", { event: "*", schema: "public", table: loc.table }, function (payload) {
                var row = payload.new || payload.old || {};
                if ((loc.table === "user_data" ? row.user_id === loc.id && row.key === loc.key : row.id === loc.id)) refresh();
              }).subscribe();
            return function () { alive = false; sbClient.removeChannel(channel); };
          }
        };
      }
    };
  }

  function startApp(user) {
    if (!user || (S.uid === user.id && S.appStarted)) return;
    S.appStarted=true; S.authUser=user; S.uid=user.id; S.myName=(user.user_metadata&&user.user_metadata.display_name)||"Member";
    S.canWrite=true; S.canUpload=true; S.canEdit=false; S.isAdmin=false; S.authReady=true; S.db=supaDB();
    S.user={me:function(){return Promise.resolve({name:S.myName});},id:function(){return Promise.resolve(S.uid);},can:function(){return Promise.resolve(true);},canEdit:function(){return Promise.resolve(S.isAdmin);},profiles:function(ids){if(!ids.length)return Promise.resolve({});return sbClient.from("profiles").select("id,data").in("id",ids).then(function(r){if(r.error)throw r.error;var out={};(r.data||[]).forEach(function(row){out[row.id]=row.data||{};});return out;});}};
    S.assets={upload:function(file){return new Promise(function(resolve,reject){if(!file)return reject(new Error("No file selected"));if(file.size>50*1024*1024){var e=new Error("File too large (50 MB maximum)");e.code="too_large";reject(e);return;}var id=newId(),safeName=String(file.name||"upload").replace(/[^a-zA-Z0-9._-]/g,"_"),path=S.uid+"/"+id+"-"+safeName;sbClient.storage.from("burrow-media").upload(path,file,{upsert:false,contentType:file.type}).then(function(r){if(r.error)throw r.error;var url=sbClient.storage.from("burrow-media").getPublicUrl(path).data.publicUrl;localAssets[id]=url;resolve({id:id});}).catch(reject);});}};
    sbClient.from("admin_roles").select("user_id,role").eq("user_id",S.uid).maybeSingle().then(function(r){if(r.error)throw r.error;S.isAdmin=!!r.data;S.canEdit=S.isAdmin;render();if(S.route==="admin"&&!S.isAdmin)location.hash="#home";}).catch(function(e){console.warn("Admin role lookup failed",e);});
    sub("communities","comms","c");sub("posts","posts","p");sub("comments","cmts","m");
    S.db.collection("profiles").onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){m[d.id]=d.data();});S.profiles=m;S.prLoaded=true;render();maybeOnboard();},onErr);
    S.db.doc("data/users/"+S.uid+"/profile").onSnapshot(function(snap){var d=snap.exists?snap.data():null;if(d)S.prof={joined:(d.joined||[]).slice(),saved:(d.saved||[]).slice()};render();},onErr);
    loadSocialData();loadProfileBadges();startSocialRealtime();startPresence();refreshAdmin();onRoute();
  }
  function boot() {
    if(!window.supabase||!window.supabase.createClient){S.failed=true;$("main").innerHTML='<div class="card empty"><h3>Could not load Burrow</h3><p>Supabase library did not load. Check your internet connection.</p></div>';return;}
    sbClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    sbClient.auth.onAuthStateChange(function(event,session){if(session&&session.user){if(!S.appStarted||S.uid!==session.user.id)setTimeout(function(){startApp(session.user);},0);}else{S.appStarted=false;S.uid=null;S.authUser=null;S.authReady=true;S.canWrite=false;S.canUpload=false;S.isAdmin=false;if(S.presenceChannel){sbClient.removeChannel(S.presenceChannel);S.presenceChannel=null;}if(S.socialChannel){sbClient.removeChannel(S.socialChannel);S.socialChannel=null;}render();}});
    sbClient.auth.getSession().then(function(r){if(r.error)throw r.error;if(r.data.session&&r.data.session.user)startApp(r.data.session.user);else{S.authReady=true;render();}}).catch(function(e){console.error("Burrow auth startup failed",e);S.authReady=true;render();authMessage(e.message||"Could not start authentication.",true);});
  }
  boot();
})();
</script>
